<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Checkout</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider checkout">
      <section class="products">
        <h2>Review & Place your Order</h2>
        
        <div class="checkout-container">
          <div class="order-summary">
            <h3>Order Summary</h3>
            <ul class="order-items" id="order-items"></ul>
            <div class="order-totals">
              <div class="total-row">
                <span>Item Total:</span>
                <span id="item-total">$0.00</span>
              </div>
              <div class="total-row">
                <span>Shipping:</span>
                <span id="shipping-total">$0.00</span>
              </div>
              <div class="total-row">
                <span>Tax:</span>
                <span id="tax-total">$0.00</span>
              </div>
              <div class="total-row grand-total">
                <strong>Order Total:</strong>
                <strong id="order-total">$0.00</strong>
              </div>
            </div>
          </div>

          <form id="checkout-form" class="checkout-form">
            <h3>Shipping Information</h3>
            <fieldset>
              <legend>Contact</legend>
              <label for="fname">
                <input type="text" id="fname" name="fname" required />
                <span>First Name</span>
              </label>
              <label for="lname">
                <input type="text" id="lname" name="lname" required />
                <span>Last Name</span>
              </label>
              <label for="email">
                <input type="email" id="email" name="email" required />
                <span>Email</span>
              </label>
              <label for="phone">
                <input type="tel" id="phone" name="phone" required />
                <span>Phone</span>
              </label>
            </fieldset>

            <fieldset>
              <legend>Address</legend>
              <label for="street">
                <input type="text" id="street" name="street" required />
                <span>Street</span>
              </label>
              <label for="city">
                <input type="text" id="city" name="city" required />
                <span>City</span>
              </label>
              <label for="state">
                <input type="text" id="state" name="state" required />
                <span>State</span>
              </label>
              <label for="zip">
                <input type="text" id="zip" name="zip" required pattern="[0-9]{5}" />
                <span>Zip Code</span>
              </label>
            </fieldset>

            <fieldset>
              <legend>Payment</legend>
              <label for="cardNumber">
                <input type="text" id="cardNumber" name="cardNumber" required 
                       pattern="[0-9]{13,16}" maxlength="16" />
                <span>Card Number</span>
              </label>
              <label for="expiration">
                <input type="text" id="expiration" name="expiration" required 
                       placeholder="MM/YY" pattern="[0-9]{2}/[0-9]{2}" />
                <span>Expiration (MM/YY)</span>
              </label>
              <label for="cvv">
                <input type="text" id="cvv" name="cvv" required 
                       pattern="[0-9]{3,4}" maxlength="4" />
                <span>Security Code</span>
              </label>
            </fieldset>

            <button type="submit" class="checkout-button">Complete Purchase</button>
          </form>
        </div>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
